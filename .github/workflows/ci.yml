name: CI - Docker Build & Test

on:
  push:
    branches: [main, master, docker-setup]
  pull_request:
    branches: [main, master, docker-setup]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      packages: write    
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR (optional for future push)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (without push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false                 
          load: true                 
          tags: calc-tests:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests from locally built image
        run: |
          docker run --rm \
            calc-tests:${{ github.sha }}
